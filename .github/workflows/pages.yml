name: Deploy FUSION SIGNAL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public report
        run: |
          python - <<'PY'
          import json,re
          with open('data/latest.json',encoding='utf-8') as f: d=json.load(f)
          required={'schemaVersion','date','publishedAt','headline','summary','topSignals','market','ecosystem','short','ignition','milestones','events','sections','sources'}
          allowed=required|{'supply'}
          assert d.get('schemaVersion')==1 and required<=d.keys() and d.keys()<=allowed
          private=re.compile(r'분할\s*추매|추가\s*매수|개인\s*전략|매수\s*(?:주문|계획|체결)|time[ -]?stop|시간\s*손절|전량\s*청산|내\s*보유|portfolio|private note',re.I)
          assert not private.search(json.dumps(d,ensure_ascii=False)), 'Sensitive trading text in public report'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
